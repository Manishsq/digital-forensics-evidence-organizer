{% extends "base.html" %}
{% block title %}New Case – DFEO{% endblock %}
{% block breadcrumb %}<a href="/cases">Cases</a> / New Case{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header"><i class="bi bi-folder-plus me-1"></i>Create New Forensic Case</div>
      <div class="card-body">
        {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        <form method="post" action="/cases/new">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Case ID <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="case_id"
                     value="{{ form.get('case_id','') }}" placeholder="CASE-2026-001" required>
              <div class="form-text">Unique identifier. Will be uppercased.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Case Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="name"
                     value="{{ form.get('name','') }}" required>
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea class="form-control" name="description" rows="3">{{ form.get('description','') }}</textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label">Organization</label>
              <input type="text" class="form-control" name="organization" value="{{ form.get('organization','') }}">
            </div>
            <div class="col-12">
              <label class="form-label">Notes</label>
              <textarea class="form-control" name="notes" rows="2">{{ form.get('notes','') }}</textarea>
            </div>
          </div>
          <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Create Case</button>
            <a href="/cases" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

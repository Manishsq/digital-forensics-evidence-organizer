<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – Digital Forensics Evidence Organizer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="dfeo-login-bg d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="card dfeo-login-card shadow-lg" style="width:100%;max-width:420px">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <i class="bi bi-shield-lock-fill text-primary" style="font-size:3rem"></i>
        <h2 class="mt-2 fw-bold">DFEO</h2>
        <p class="text-muted small">Digital Forensics Evidence Organizer</p>
      </div>
      {% if error %}
      <div class="alert alert-danger alert-dismissible fade show py-2" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endif %}
      <form method="post" action="/login">
        <div class="mb-3">
          <label for="username" class="form-label text-muted small">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="Enter username" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label text-muted small">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Enter password" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
        </button>
      </form>
      <div class="text-center mt-4 text-muted" style="font-size:.75rem">
        For authorized forensic personnel only.<br>All access is logged and audited.
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
